name: Release Chrome Extension

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Update manifest version
        run: |
          VER="${{ steps.ver.outputs.version }}"
          sed -i "s/\"version\": \".*\"/\"version\": \"$VER\"/" chrome-extension/manifest.json
          echo "Manifest version: $(grep '\"version\"' chrome-extension/manifest.json)"

      - name: Build .zip
        run: |
          cd chrome-extension
          ZIP="SonioxLiveTranslate-Extension-${{ steps.ver.outputs.version }}.zip"
          zip -r "../$ZIP" . -x "*.git*" -x "*.DS_Store"
          echo "ZIP=$ZIP" >> $GITHUB_ENV
          SIZE=$(du -sh "../$ZIP" | cut -f1)
          echo "Built: $ZIP ($SIZE)"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: SonioxLiveTranslate-Extension-*.zip
